[package]
name = "allocator-experiment"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[features]
default = []
mi = ["dep:mimalloc", "dep:libmimalloc-sys"]
rp = ["dep:rpmalloc"]

[dependencies]
mimalloc = { version = "=0.1.52", default-features = false, optional = true }
libmimalloc-sys = { version = "=0.1.49", default-features = false, optional = true }
rpmalloc = { version = "=0.2.2", default-features = false, optional = true }
bumpalo = { version = "=3.20.3", default-features = false, features = ["boxed"] }
native-state-vnext = { path = "../../crates/native-state-vnext" }
rustcraft-core = { path = "../../crates/rustcraft-core" }
native-chunk = { path = "../../crates/native-chunk" }
native-observability = { path = "../../crates/native-observability" }
compression = { path = "../../crates/compression" }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
zlib-rs = "=0.6.8"
serde_json = "=1.0.145"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
