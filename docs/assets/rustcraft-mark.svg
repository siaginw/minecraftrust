<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="RustCraft mark">
  <!-- RustCraft: a chunk-grid cube with a Rust gear face. Original geometry;
       not derived from any Mojang asset. Render-safe on light and dark. -->
  <defs>
    <linearGradient id="faceTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#d4711e"/>
    </linearGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e4a12"/>
      <stop offset="1" stop-color="#7a3a0e"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2661a"/>
      <stop offset="1" stop-color="#8f4710"/>
    </linearGradient>
  </defs>
  <!-- cube: top (grid), left (grid), right (gear face) -->
  <g stroke-linejoin="round">
    <!-- top -->
    <path d="M120 28 L216 76 L120 124 L24 76 Z" fill="url(#faceTop)"/>
    <!-- left -->
    <path d="M24 76 L120 124 L120 224 L24 176 Z" fill="url(#faceL)"/>
    <!-- right -->
    <path d="M216 76 L120 124 L120 224 L216 176 Z" fill="url(#faceR)"/>
  </g>
  <!-- chunk grid on top: 4x4 quarter lines -->
  <g stroke="#3d1c07" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M48 64 L144 112 M72 52 L168 100 M96 40 L192 88"/>
    <path d="M48 64 L168 100 M96 40 L144 112 M192 88 L72 52"/>
  </g>
  <!-- grid on left face -->
  <g stroke="#2c1305" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M24 108 L120 156 M24 140 L120 188"/>
    <path d="M54 93 L54 193 M84 110 L84 210"/>
  </g>
  <!-- gear on right face (Rust nod): circle + teeth, centered ~168,150 -->
  <g transform="translate(168,150)">
    <circle r="34" fill="#3f2a12" fill-opacity="0.0"/>
    <g fill="#2c1305">
      <circle r="14"/>
      <g id="teeth">
        <rect x="-5" y="-34" width="10" height="12" rx="2"/>
      </g>
      <use href="#teeth" transform="rotate(45)"/>
      <use href="#teeth" transform="rotate(90)"/>
      <use href="#teeth" transform="rotate(135)"/>
      <use href="#teeth" transform="rotate(180)"/>
      <use href="#teeth" transform="rotate(225)"/>
      <use href="#teeth" transform="rotate(270)"/>
      <use href="#teeth" transform="rotate(315)"/>
    </g>
    <circle r="6" fill="#f0883e"/>
  </g>
  <!-- outline -->
  <path d="M120 28 L216 76 L216 176 L120 224 L24 176 L24 76 Z" fill="none" stroke="#241004" stroke-opacity="0.8" stroke-width="4" stroke-linejoin="round"/>
</svg>
