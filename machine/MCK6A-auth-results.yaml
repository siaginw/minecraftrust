authority_architecture: >
  FrameAuthorityHandler (new) takes authority ONLY for compression+length
  framing. Java remains authoritative for packet SERIALIZATION — the canonical
  Rust input is the complete immutable Java-serialized packet body (packet-ID
  included), the exact input validated by 53,140 observer-ladder comparisons.
  Installed by the proven setCompressionThreshold hook under
  -Dminecraftrust.frame_authority=ON_EXPERIMENTAL (default OFF; transformer
  inert when OFF). Position addBefore("encoder") — receives the serialized body
  post-encoder, pre-compressor. COMPLETE-FRAME-OR-NOTHING: the entire Rust
  frame is built off-pipeline BEFORE any production state is mutated; on
  success exactly one complete frame is written via the PREPENDER'S OWN
  context (outbound resumes head-ward of the prepender — the Java compressor
  and prepender are BYPASSED, spy-proven offline — into the normal downstream
  path); on ANY failure the original untouched message + promise go through
  ctx.write() = the byte-identical normal Java path. Fail-closed installation
  by handler name and verified order; every fallback counted by reason;
  quiescence-safe context free (the proven protocol). Sampled post-production
  cross-check (1-in-16): the transmitted frame is independently structural-
  decoded and compared to the captured original — without re-running Java
  framing.
offline_authority_gates: >
  MCK6AuthorityGates 11/11: authority output decodes to the original body
  across compressed/at-threshold/passthrough with the correct split and Java
  codecs BYPASSED (spy counters 0); forced native failure and closing-handler
  fallbacks BYTE-IDENTICAL to the pure-Java pipeline with the Java codecs
  exercised; slice indices untouched at fallback; 40 interleaved writes with
  every-3rd forced failure -> all 40 decode exactly once, no backlog,
  counters sum to N (no loss/duplication/partial); live threshold update
  256->4096 flips compressed->passthrough; heap/direct/slice/composite inputs;
  sampled cross-check catches forced corruption (negative control);
  missing-prepender and misordered pipelines install NOTHING (fail closed,
  behavior byte-identical to the bare pipeline); quiescence free after hard
  executor shutdown.
