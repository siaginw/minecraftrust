A_verifier_npe_root_cause: >
  Sited by stack capture: the sampled Java REFERENCE construction (nested
  SPacketChunkData on the packet thread) NPE'd at SPacketChunkData ctor line 33
  (the payload-size/materialization region) — mid-POPULATION chunks carry
  transient state (e.g. null light arrays during relight) that vanilla itself
  never serializes: PlayerChunkMap only sends populated chunks, while our
  native-eligible window can occur mid-generation. Off-thread (flush-thread)
  construction ALSO fails on quiescent chunks (6 errors) — the constructor is
  effectively thread-confined. Per the directive, off-thread construction was
  NOT forced.
B_verifier_architecture_final: >
  Quiescence-based deferred reference: native samples record {chunk, version,
  payload}; when the chunk QUIESCES (version unchanged + zero pending work +
  synced), the Java reference is built and both payloads verified by independent
  decode. Live-result: 13 sampled -> 7 stale-skips (temporal guard held:
  population/light churn kept bumping versions) + 6 thread-confined reference
  errors + 0 completed. The mechanism is architecturally complete (offline
  13/13 including a full sample round-trip) but WORKLOAD-STARVED live: this
  bot workload never lets a sampled chunk quiesce long enough for an
  independent reference at equal version.
