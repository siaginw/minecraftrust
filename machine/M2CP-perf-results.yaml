# M2CP matched OFF/ON performance + production-readiness study (operator
# authorization 2026-09-20 — the FINAL bounded M2-C study). FTB Revelation
# 3.4.0 / Target C. 6 fresh-JVM runs strictly alternating OFF_MEASURE,ON x3.
# class: MEASURED. Provenance: M2CP-MATCHED-PERF.
# Scope: network-worker compression path ONLY. NO TPS/MSPT claim (directive 3:
# MSPT recorded as non-primary and NOT resolved by this experiment).
schema_version: 1
date: "2026-09-20"
target:
  pack: "FTB Revelation 3.4.0 (existing install/world/config unaltered)"
  forge: "14.23.5.2846"
  java: "Temurin jdk-8.0.504.1-hotspot"
  mods: 193 (FoamFix + Phosphor)
  jvm_flags_both_arms: "-Xms6G -Xmx6G -XX:+PrintGCDetails -XX:+PrintGCDateStamps -XX:+PrintGCApplicationStoppedTime -Xloggc:gc-<label>.log; only -Dminecraftrust.native_compress differs"
builds:
  dll: {sha256_prefix: 0acb7469a74d9531, note: "unchanged since M2.0"}
  coremod: {sha256_prefix: 981354f5c4de1d96, note: "MEASUREMENT build: adds OFF_MEASURE mode (vanilla-authoritative wire + nanoTime brackets), ON timing span extended to include framing (sampled verify outside span), m2c_java_packets counter, Netty-Server-IO thread CPU dump (one-shot, shutdown+periodic). OFF/SHADOW wire semantics unchanged; offline 33/33 incl. new OFF_MEASURE vanilla-identity test (wire bytes BYTE-IDENTICAL to pure vanilla, ctx delta 0)."}
measurement_design:
  java_arm: "OFF_MEASURE: encoder installed (transform success) but super.encode() produces the authoritative vanilla bytes; eligible packets bracketed with System.nanoTime -> m2c_java_ns/m2c_bytes_java/m2c_java_packets. No native context ever created (ctx 0/0 in all 3 OFF runs)."
  rust_arm: "ON_EXPERIMENTAL: native authoritative; m2c_rust_ns spans JNI compress + framing writes (sampled 1-in-256 verify OUTSIDE the span)."
  span_asymmetry_note: "m2c_java_ns brackets super.encode() INCLUDING its internal plaintext copy; m2c_rust_ns excludes the shared msg.getBytes() copy (which vanilla does not need). Residual asymmetry = one ~30KB memcpy per packet (~1-3 us vs ~140-310 us span, <1%). Bias direction: slightly favors Rust; effect below noise."
  no_dual_compression: "OFF runs pure Java, ON runs pure Rust (bytes_java=0 in ON runs; native_packets=0 in OFF runs). Verified in every shutdown dump."
workload: "Per run: fresh JVM -> boot (~105s) -> settle 30s -> login probe -> perfbotb corridor walk 400s (97 hops x 40 blocks, ping-pong span 600, view-distance 10, threshold 256). Windows 580s, stop-tail 45s, targeted JVM kill between runs. Client decode 0 errors in all 6 runs (4,423,684 frames total)."
workload_matching_limitation: "the walk advances perfbotb's saved position between runs, so each run streams a slightly different fresh-vs-cached chunk mix (first run 33,770 chunks vs 32.2-32.5k later); volume/compressibility matched within single-digit percent and the alternating order neutralizes drift. Quark cascading-worldgen warnings appear on ServerThread in some runs equally by mechanism; MSPT (non-primary) shows no arm difference."
