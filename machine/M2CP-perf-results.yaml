size_tradeoff:
  extra_wire_bytes: "ON ratio 13.8 vs OFF 13.7 per matched plaintext = +0.7-1.2% of compressed volume; ~+1.2 MB per 1.2 GB streamed (+0.10% of plaintext). Worst single run (n1): ratio 14.5 (+5.8% vs OFF median) - reported, not averaged away."
  cpu_saved: "median -12.1 s compression CPU per 400 s walk window; Netty worker total -13.1 s (-39.9%) across 4 worker threads."
  verdict: "at this workload's 3.0 MB/s plaintext streaming rate the bandwidth cost is negligible (~+5 KB/s wire) while worker CPU drops by double digits of seconds per walk window; per-byte advantage (2.26x) scales linearly with player count/traffic."
leak_observation: "1 UNTRACED leak event in run n2 (default SIMPLE leak detection - no stack recoverable). Frequency matches the 4x-established ElecCore baseline on this pack (~1 per 10 logins; M2CC/M2CER paranoid stacks were 100% elec332.* with ZERO m2c frames). Not attributable to M2-C by any available evidence; NOT stack-proven in this run (paranoid-level was not used - these are perf runs, not correctness runs)."
production_readiness_audit: # from code + prior campaign evidence; no redesign needed
  default_off: "VERIFIED: property default 'OFF' -> transformer DISABLED_BY_PROPERTY (byte-identical NetworkManager); live OFF run in M2C had all counters zero."
  property_handling: "VERIFIED: -Dminecraftrust.native_compress={OFF,SHADOW,ON_EXPERIMENTAL}; AUDIT NOTE: an UNKNOWN value transforms the class but encode() falls through to SHADOW semantics (Java-authoritative wire + native compare) - SAFE degradation (never ON), surprising but acceptable for experimental."
  missing_dll_fallback: "VERIFIED (code + offline G): CompressionCtx.LOADED=false -> super.encode() for every packet even with property ON; wire stays vanilla."
  unsupported_architecture: "VERIFIED (code): System.loadLibrary failure of any kind -> LOADED=false -> same vanilla path."
  native_load_failure: "VERIFIED (code): caught Throwable in static loader; same path."
  unexpected_mod_handler: "VERIFIED (code + live C/D): transformer rewrites only the vanilla construction inside the one method referencing the 'compress' LDC; a pre-existing mod handler is never replaced (vanilla func_179299_a branch unchanged). No mod occupies the seam on Revelation or SevTech."
  shutdown_cleanup: "VERIFIED: handlerRemoved frees ctx exactly once (AtomicLong CAS); balanced in ALL runs ever (this study 2/2 per ON run; 100/100 across A/C/D campaigns)."
  reconnect_lifecycle: "VERIFIED: 60+ sequential bot sessions across campaigns + this study's alternating fresh-JVM runs."
  error_logging_rate: "VERIFIED N/A-BY-DESIGN: native errors increment AtomicLong counters only, zero per-event logging -> no log-spam vector; counters dumped periodically (10s) and at shutdown."
final_classification: READY_OPTIONAL
final_classification_reasoning: >
  Correctness is complete (ladder: offline 33/33; SHADOW 146,259/146,259 on
  packs; ON across A/C/D with 139,530 packets, 0 M2C-attributable faults,
  contexts 100/100; this study adds 195,712 more native packets, 0 fallbacks,
  0 decode errors over 4.42M frames). Matched performance now provides a
  real, consistent network-worker benefit: 2.26x compression throughput
  (non-overlapping 3v3), -56.8% compression CPU, -39.9% Netty worker CPU,
  at +0.7-1.2% wire bytes - a decisively favorable tradeoff at any realistic
  streaming rate. GC and MSPT show no arm difference (MSPT unresolved, not
  claimed). Classification A: READY_OPTIONAL. Default-ON is NOT decided
  here (operator explicitly deferred it).
remaining_limitations:
  - "all traffic is protocol-bot; no real human-client gameplay evidence"
  - "n=3 per arm, single machine, single pack (Revelation) for the perf arm; SevTech/Target-A perf not re-measured (correctness-holding by ladder)"
  - "walk-window streaming rate ~3.0 MB/s plaintext; the 2.26x per-byte advantage is measured, but absolute CPU savings scale with traffic"
  - "timing-span asymmetry: rust_ns excludes the shared plaintext copy java_ns includes (<1% effect, favors Rust; documented above)"
  - "the 1 untraced leak event in n2 could not be stack-attributed (SIMPLE detection); attribution rests on frequency + 4 prior traced baselines"
