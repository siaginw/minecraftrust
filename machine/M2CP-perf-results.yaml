  m2cp-c-o1: {arm: OFF_MEASURE, eligible: 68851, plain_MB: 1228.3, comp_MB: 163.7, ratio_pct: 13.3, mb_per_s: 3.1, us_per_pkt: 310.4, compress_MBp_s: 57.5, compress_s: 21.4, netty_cpu_s: 33.0, gc_young: 87, gc_full: 5, gc_pause_ms: 2466.2, mspt_mean: 8.2, chunks: 33770, hops: 97, client_errors: 0}
  m2cp-c-n1: {arm: ON, eligible: 65052, plain_MB: 1220.6, comp_MB: 177.5, ratio_pct: 14.5, mb_per_s: 3.1, us_per_pkt: 141.2, compress_MBp_s: 132.9, compress_s: 9.2, netty_cpu_s: 19.8, gc_young: 94, gc_full: 5, gc_pause_ms: 2588.5, mspt_mean: 11.4, chunks: 32248, hops: 97, client_errors: 0}
  m2cp-c-o2: {arm: OFF_MEASURE, eligible: 65032, plain_MB: 1120.2, comp_MB: 153.7, ratio_pct: 13.7, mb_per_s: 2.8, us_per_pkt: 297.3, compress_MBp_s: 57.9, compress_s: 19.3, netty_cpu_s: 32.3, gc_young: 96, gc_full: 5, gc_pause_ms: 2577.5, mspt_mean: 13.7, chunks: 32234, hops: 97, client_errors: 0}
  m2cp-c-n2: {arm: ON, eligible: 65313, plain_MB: 1188.0, comp_MB: 164.0, ratio_pct: 13.8, mb_per_s: 3.0, us_per_pkt: 140.7, compress_MBp_s: 129.3, compress_s: 9.2, netty_cpu_s: 22.0, gc_young: 99, gc_full: 5, gc_pause_ms: 2712.2, mspt_mean: 14.2, chunks: 32380, hops: 97, client_errors: 0}
  m2cp-c-o3: {arm: OFF_MEASURE, eligible: 65414, plain_MB: 1200.0, comp_MB: 166.0, ratio_pct: 13.8, mb_per_s: 3.0, us_per_pkt: 325.1, compress_MBp_s: 56.4, compress_s: 21.3, netty_cpu_s: 32.9, gc_young: 94, gc_full: 5, gc_pause_ms: 2593.8, mspt_mean: 13.1, chunks: 32519, hops: 97, client_errors: 0}
  m2cp-c-n3: {arm: ON, eligible: 65347, plain_MB: 1085.5, comp_MB: 150.3, ratio_pct: 13.8, mb_per_s: 2.7, us_per_pkt: 128.1, compress_MBp_s: 129.7, compress_s: 8.4, netty_cpu_s: 16.2, gc_young: 91, gc_full: 5, gc_pause_ms: 2590.8, mspt_mean: 13.3, chunks: 32537, hops: 97, client_errors: 0}
