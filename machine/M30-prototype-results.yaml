java_vs_rust_conclusion: >
  The indexed ALGORITHM captures essentially all of the query-time benefit
  in Java: java_ix medians match rust_ix (100-200 ns) on every realistic
  dataset, both 12-1257x faster than linear. Rust wins appear only in
  pathological build-heavy shapes (huge-box build 2.1x faster, queries 3x)
  and lose small builds (per-insert JNI). No packed-layout/SIMD/parallelism
  advantage is material at these bucket sizes.
collision_reuse: # directive 10 - analysis only, nothing implemented
  reusable_pieces: "LongKeyBuckets (long-key->ids) and the region-key packing are directly reusable for section-occupancy bitsets; the deterministic small-bucket pattern fits"
  differing_invalidation: "collision needs per-setBlockState COUNTER updates (Lithium model, high-frequency writes); structures use generation-event APPENDS (low-frequency) - the invalidation SEMANTICS differ; only the primitive container is shared, not an engine"
  verdict: "reuse is REAL but at the utility-crate level only - consistent with the M3R recommendation (specialized index + shared utility, no shared engine)"
classification: ALGORITHM_ONLY
classification_reasoning: >
  Parity is perfect and the algorithm is a measured win (114.9x candidate
  reduction on the largest real map; 12-1257x wall-clock query speedup),
  but the Java implementation of the SAME index captures nearly all of
  it; Rust adds ~equal queries, mixed builds, and no unique architectural
  advantage at realistic scales. Per the directive's own decision rule
  this is ALGORITHM_ONLY, not RUST_STRONG. The M3 live-server value case
  (removing the 12.2% ServerThread cluster) is achievable with EITHER
  implementation; per the PRIMARY PROJECT RULE (Rust is the optimization
  layer, but Java-patch-for-its-own-sake is out of scope), the honest
  recommendation is to PARK the native spawn index and NOT port the
  algorithm to Java either (that would be a Java performance patch),
  UNLESS the operator explicitly wants a Java-side engine patch.
recommendation: "PARK the native M3-SPAWN-QUERY-INDEX (ALGORITHM_ONLY verdict; algorithm validated, native value not justified at realistic scale). No live SHADOW integration. Assets retained: crates/spatial-index utility (tested, reusable), crates/spawn-index + JNI surface (parity-proven), the verified mutation/query-semantics disassembly, and the extraction tooling - any future consumer can revive the work. M3 status returns to UNSELECTED pending either (a) operator direction to pursue Java-side engine patches (explicitly out of the project's current charter) or (b) a new native candidate with real Rust leverage."
stop: "No live integration, no coremod changes, no SHADOW, no defaults changed. Offline evidence only."
