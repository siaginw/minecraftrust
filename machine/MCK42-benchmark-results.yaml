architecture: >
  ALL arms are handler-shaped behind equivalent warmed EmbeddedChannel pipelines
  (the M-CK4.1 asymmetry — B as a direct helper call while A/C paid channel
  overhead — is closed). A: installed NettyCompressionEncoder + installed
  NettyVarint21FrameEncoder (vanilla 2-handler pipeline). B:
  MCK42RustCompressJavaFrameHandler (CK2 native compressor, inner framing; below
  threshold = pure-Java passthrough, no JNI, no native-context creation) +
  INSTALLED prepender — the M-CK2 production shape. C: RustFrameHandler (1
  handler: threshold + compression + both framings in Rust). Encode runs inline
  on the calling thread for every arm (the permissive embedded loop; in
  production the same encode runs on the channel's single event-loop thread).
  DISABLED phase uses the ACTUAL vanilla contract (NetworkManager.func_179289_a
  disassembly: negative threshold REMOVES the compression handlers): A' =
  installed prepender only; C' = RustFrameHandler(-1); B'≡A' by construction
  (no Rust code runs when compression is off; B's handler must not be installed)
  — reported, not timed separately.
equivalence_rules: >
  Same immutable heap byte[] inputs and fixture schedule for all arms; warmed
  reusable channel per arm; timed span = writeOutbound -> readOutbound -> copy
  to caller byte[] (draining + consumption included); decode/validate EVERY
  iteration OUTSIDE the timed span (first iteration included); cleanup outside
  steady-state timing; cold creation + first operation measured separately and
  symmetrically BEFORE any warmup (30 reps/arm, same first payload). Result sink
  corrected per directive: no single fixed reference across varying inputs —
  each output validated against ITS scheduled input; within-arm determinism
  against that (arm,payload)'s first output; uncompressed framings (passthrough
  payloads + all disabled frames) must match ACROSS arms byte-exactly; compressed
  bytes NOT compared across Java/Rust (JDK deflate vs zlib-rs differ: e.g.
  real-31k frame 127 B vs 130 B, both decode to the original).
method: >
  3 fresh JVMs, rotations ABC/BCA/CAB (args[0]); per-iteration intra-JVM arm
  order also rotates; 9-payload deterministic labeled schedule x 15 warm + 40
  timed passes; allocation pass via com.sun.management.ThreadMXBean
  getThreadAllocatedBytes delta (untimed, 1 schedule pass/arm). Raw outputs:
  machine/raw/MCK42-bench-{ABC,BCA,CAB}.txt. Schedule labels payloads REAL vs
  SYNTHETIC and does NOT model live traffic distribution.
