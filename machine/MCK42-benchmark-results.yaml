validation: "Every iteration of every arm decoded to its scheduled input; within-arm determinism enforced; cross-arm byte equality enforced for all deterministic framings; 0 validation errors across all 3 JVMs"
remaining_costs_recorded:
  - "Disabled-mode JNI staging/copy: C' 3.5-4.8x slower than the pure-Java prepender — in any production ON shape, the Rust frame handler must be installed ONLY when compression is enabled (vanilla already removes the handler when disabled)"
  - "Heap allocation: Rust arms allocate ~33% more per iteration (staging copies + fresh result arrays); direct-buffer scratch ~2 MiB per context retained"
  - "Per-encode ownership membership check included in arm C (executor.inEventLoop()); threshold reads are volatile; ordering cost is the single-thread FIFO executor serialization"
  - "JDK-vs-zlib-rs compressed bytes differ (valid streams, decode-equal, NOT byte-equal): any future SHADOW comparator must compare post-inflate payloads, never raw compressed bytes"
