# Minecraft 1.12.2 Block Storage Architecture Specification
version: "1.12.2"

chunk_layout:
  class: "net.minecraft.world.chunk.Chunk"
  dimensions:
    x_blocks: 16
    z_blocks: 16
    y_blocks: 256
    sections: 16
    blocks_per_section: 4096
    total_blocks_per_chunk: 65536
  storage_arrays:
    field: "storageArrays"
    type: "ExtendedBlockStorage[16]"
    indexing: "y >> 4"
    null_behavior: "Null or NULL_BLOCK_STORAGE treated as all-air section"
  auxiliary_arrays:
    biomes:
      field: "blockBiomeArray"
      type: "byte[256]"
      indexing: "(z & 15) << 4 | (x & 15)"
      encoding: "Unsigned 8-bit biome ID (Biome.REGISTRY)"
    heightmap:
      field: "heightMap"
      type: "int[256]"
      indexing: "(z & 15) << 4 | (x & 15)"
      definition: "Highest non-air/light-opaque block Y coordinate + 1"
    precipitation_heightmap:
      field: "precipitationHeightMap"
      type: "int[256]"
      sentinel_reset_value: -999
    update_skylight_columns:
      field: "updateSkylightColumns"
      type: "boolean[256]"

section_layout:
  class: "net.minecraft.world.chunk.storage.ExtendedBlockStorage"
  fields:
    y_base: "int (section_index << 4)"
    block_ref_count: "int (count of non-air blocks, empty if 0)"
    tick_ref_count: "int (count of blocks where block.getTickRandomly() == true)"
    data: "BlockStateContainer"
    block_light: "NibbleArray (2048 bytes, 4 bits per block)"
    sky_light: "NibbleArray (2048 bytes, null if world has no sky)"
  index_formula: "(y & 15) << 8 | (z & 15) << 4 | (x & 15)"

block_state_container:
  class: "net.minecraft.world.chunk.BlockStateContainer"
  bit_array:
    class: "net.minecraft.util.BitArray"
    spanning_boundary_allowed: true
    packing_rule: "Pack continuous bits across 64-bit long boundaries without word padding (1.12.2 legacy format)"
  palette_tiers:
    linear:
      class: "net.minecraft.world.chunk.BlockStatePaletteLinear"
      bits: 4
      capacity: 16
      transition_condition: "Inserted unique states > 16"
    hashmap:
      class: "net.minecraft.world.chunk.BlockStatePaletteHashMap"
      bits_range: [5, 8]
      capacity_range: [32, 256]
      transition_condition: "Inserted unique states > 256"
    global:
      class: "net.minecraft.world.chunk.BlockStatePaletteRegistry"
      bits_calculation: "MathHelper.log2DeBruijn(Block.BLOCK_STATE_IDS.size())"
      bits_range: [13, 16] # 13 bits (<= 8192 states) up to 16 bits (<= 65536 states, capped by MAX_BLOCK_ID = 4095)
      capacity: "Bounded by GameData.MAX_BLOCK_ID = 4095 (max 65,536 total block states)"
      transition_condition: "Inserted unique states > 256"
