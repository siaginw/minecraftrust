A_deferred_architecture: >
  When a Java authoritative packet is built for a chunk whose NativeChunk is not
  yet synchronized, the packet thread captures a bounded record (coords, dim,
  Java payload bytes, mask/filter/skylight metadata, Java mutation version,
  native generation handle, timestamp) and returns immediately. The Java packet
  sends normally. The background flush cycle completes the chunk's first-touch
  full sync, then processes deferred records: encode Rust Protocol-340 from
  native state, compare against the captured payload. No network resend, no
  packet-thread blocking, no scope widening.

B_temporal_model: >
  ChunkMutationTracker keeps a per-chunk Java mutation VERSION bumped on every
  observable mutation path. Capture records version V. A deferred comparison is
  valid ONLY if versionOf(chunk) == V at processing time AND the native
  generation handle is unchanged. Otherwise DEFERRED_STALE_SKIP — temporal
  snapshots are never mixed and neither side is ever fixed up.

C_bounded_queue: >
  max 1024 pending records / 32 MB total captured bytes / 128 KB per record /
  15 s expiry; on capacity pressure records are skipped with
  deferred_capacity_skipped. Observed: peak 2,409,141 bytes (7.5% of budget),
  0 capacity skips, 0 pending at shutdown (drained clean).

