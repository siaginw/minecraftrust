    NOW SITED AND FIXED: the M4.2C build's stack capture + an offline reproduction
    through fullSync's validation path give the full stack — AIOOBE at
    M4Coherency.decodeEquals (parse loop): when validating a section that was
    refreshed to all-air (legitimately absent from the full-chunk packet), the
    section locator kept parsing into the 256-byte biome tail. Same code path and
    counter signature as M4.2B's unsited errors — the M4.2B per-exception sites are
    resolved by identity of mechanism (same method, same exception, same
    refreshed-then-validated ordering). Fix: parse stops when the remainder is the
    biome tail (<=256 bytes); absence then flows into the all-air verdict.
    M4.2B's exact 7-section attribution remains mechanism-explained; with the fix,
    the class cannot recur.
