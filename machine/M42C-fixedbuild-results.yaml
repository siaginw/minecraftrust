  root_cause: >
    Registration-time light is a DEFAULT (sky=0xFF). The Java light engine sets real
    sky light in sections that never had a block mutation — such sections carry no
    dirty bit, so dirty-only refresh never reached them: first compare showed stale
    default light (Java skyLight[0]=0 under terrain vs native 0xFF). Same evidence-class
    as the M4.2B biome hole: the offline harness refreshed all sections manually and
    masked it.
  fix: >
    First-touch full synchronization: until a chunk has been fully synced once, any
    consumer-driven refreshChunkNow pulls ALL 16 sections (states + light, with
    validation) plus biomes; afterwards dirty-only. WeakHashMap keyed by chunk —
    reloaded chunks re-sync. Offline regression: negative control reproduces
    skyLight[0]; positive equal after the live entry.
  terrain_and_hooks: "2,991/2,991 terrain-exact, 2,991 registered; 22,114,378 block-sets + 2,501,145 light-sets recorded into masks; biomes_pushed=1 (the comparator's single compare — the setBiomes path functioned)"
