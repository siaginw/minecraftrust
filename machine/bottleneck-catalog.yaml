distributed_normalization:
  test_a_realistic_operational:
    description: 10 players at normal view-distance 10; realistic operational deployment
    clustered:
      players: 10
      regions: 1
      loaded_chunks: 289
      mean_mspt: 33.5
      cache_miss_pct: 4.8
    distributed:
      players: 10
      regions: 10
      loaded_chunks: 2890
      mean_mspt: 48.9
      cache_miss_pct: 18.2
    delta_compute_pct: 45.97
    interpretation: Measures total operational cost under unrestricted player dispersion
      (includes 10x chunk volume).
  test_b_normalized_work:
    description: 'Equalized active work: exactly 500 loaded chunks and 1,000 TEs in
      1 region vs across 5 regions'
    clustered_single_region:
      regions: 1
      loaded_chunks: 500
      active_tes: 1000
      mean_mspt: 24.2
      cache_miss_pct: 5.2
    distributed_five_regions:
      regions: 5
      loaded_chunks: 500
      active_tes: 1000
      mean_mspt: 26.8
      cache_miss_pct: 8.4
    delta_compute_pct: 10.74
    interpretation: True spatial distribution penalty with identical work is only
      +10.7%, driven by L3 cache scattering.
