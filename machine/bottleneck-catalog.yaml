chunk_save_phase_decomposition:
  total_autosave_spike_ms: 94.5
  phases:
  - phase: SAVE-A
    name: Vanilla section / biome / heightmap snapshot construction
    server_thread_ms: 14.2
    bg_time_ms: 0.0
    classification: REMOVABLE (Direct off-heap snapshot)
  - phase: SAVE-B
    name: Entity Java NBT serialization
    server_thread_ms: 8.4
    bg_time_ms: 0.0
    classification: JAVA CALLBACK REQUIRED (Entity.writeToNBT)
  - phase: SAVE-C
    name: TileEntity Java/mod NBT serialization
    server_thread_ms: 26.2
    bg_time_ms: 0.0
    classification: JAVA CALLBACK REQUIRED (TileEntity.writeToNBT)
  - phase: SAVE-D
    name: Forge capability serialization
    server_thread_ms: 6.8
    bg_time_ms: 0.0
    classification: JAVA CALLBACK REQUIRED (ICapabilitySerializable.serializeNBT)
  - phase: SAVE-E
    name: ChunkDataEvent.Save / mod mutation
    server_thread_ms: 4.1
    bg_time_ms: 0.0
    classification: JAVA CALLBACK REQUIRED (Mod event listeners)
  - phase: SAVE-F
    name: Binary NBT compound encoding (writeToStream)
    server_thread_ms: 21.6
    bg_time_ms: 0.0
    classification: REMOVABLE (Native binary NBT writer off-thread)
  - phase: SAVE-G
    name: Deflate compression (ZLIB/Region)
    server_thread_ms: 6.0
    bg_time_ms: 8.5
    classification: BACKGROUND ONLY (libdeflate worker)
  - phase: SAVE-H
    name: RegionFile disk write
    server_thread_ms: 7.2
    bg_time_ms: 18.2
    classification: BACKGROUND ONLY (FileIOThread / direct async write)
