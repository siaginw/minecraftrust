adapter:
  architecture: >
    RustFrameHandler extends Netty MessageToByteEncoder<ByteBuf> — the
    handler-shaped form of the frame engine: one complete immutable packet
    body in, one complete unencrypted frame out. Added tail-most in the
    offline pipeline (outbound tail->head ordering — the M-CK3 lesson), so
    it replaces compression+prepender with NO double framing by
    construction. One reusable native OutboundFrameCtx per handler
    (connection lifetime; handlerRemoved frees it). Effective threshold via
    setThreshold() (volatile under the single-event-loop owner contract;
    update counter preserves message-order observability). Buffer forms:
    heap/direct/readerIndex-nonzero/slices accepted via one staging copy;
    composites via the same path. No global scratch.
  wiring_diagram: "[body ByteBuf] -> RustFrameHandler(stage copy -> native frameEncode JNI -> frame copy) -> [framed ByteBuf]"
parity_and_gates: "MCK4Validation 16/16 + M53FrameOracle 25/25 (regression): real fixture compressed+disabled; synthetic relabeled; adapter==installed parity (exact bytes disabled; independent decode both arms); threshold transitions on a reused connection (incl. threshold 0 and disable); nonzero readerIndex + slice; frame A retained while B produced; handlerRemoved frees ctx; concurrent independent pipelines (200 ops x2); capacity retry; corruption negatives; inflater completion + full-consumption + end() checks; empty-body rejection"
benchmark_corrected: >
  3 fresh JVMs, REAL 31,023 B packet body @256, warm arms (one channel/ctx
  each outside timing), rotated order, contents checked:
  JVM1: A 85.04 / B 30.30 / C 32.30 us mean (B/A=0.356x, C/A=0.380x, C/B=1.066x)
  JVM2: A 85.81 / B 30.26 / C 32.57 us (0.353x, 0.380x, 1.076x)
  JVM3: A 85.14 / B 30.36 / C 32.56 us (0.357x, 0.382x, 1.072x)
  p50s: A ~84 / B ~28 / C ~31.5 us. Scope spots (single JVM each):
  incompressible 31KB: B/A=0.756x C/A=0.774x; below-threshold 128B:
  B/A=0.042x (Java passthrough) C/A=0.881x.
  Honest summary: at chunk sizes the complete Rust frame path is ~2.6x the
  warm Java pipeline and ~7% slower than CK2+Java-framing (C/B~1.07); the
  adapter's value here is OWNERSHIP (all framing semantics in Rust), not
  incremental latency. Tiny packets favor the Java passthrough shape.
