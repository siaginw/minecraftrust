pipeline_research: >
  Verified live per channel by NAME before any mutation (liveInstall; fail
  closed on mismatch). Verified layout (head->tail): [timeout, splitter,
  decompress, decoder, mck5-frame-observe, prepender, compress, mck5-capture,
  encoder, packet_handler, TailContext#0] — same semantic order as Target A
  with no encrypt (offline mode) and no legacy_query; Forge's
  fml:packet_handler (NetworkDispatcher, addBefore packet_handler per its
  bytecode) is not present at install time. No mod-added outbound handlers
  between the observer boundaries. FML|MP multipart (FMLProxyPacket.toMultipart
  bytecode: payloads >32767 split into SPacketCustomPayload parts on channel
  FML|MP, first part = [channel][byte][int] header = the observed 20-byte
  packet) is the modpack-specific traffic class that exposed the pairing defect
  below.
defect_found_and_fixed: >
  LIVE DEFECT (first ever semantic mismatches): Forge drops/bypasses the FML|MP
  multipart HEADER write between the capture boundary and the prepender (ordered
  write-trace proof: captured 20-byte header C#12 — [id 0x18]["FML|MP"][channel-
  string][byte][int], exactly FMLProxyPacket.toMultipart's header per its
  bytecode — its frame NEVER observed; the next message's 1,048,504-byte data-
  part frame was then absorbed by the stale pending -> mis-pairing -> mismatch;
  the observer correctly DISABLED per channel and never counted a false match).
  ROOT CAUSE (observer): a captured message whose frame never reaches the frame
  observer left a stale pending that a LATER frame consumed. FIX v1: retire an
  incomplete pending at the next SELECTED capture + install frame-observe before
  capture; verified live at every=1 (200/200 matched) — but the definitive
  campaign at every=2 STILL mismatched (run MCK5LR-20260923-000217, preserved):
  the next message was SAMPLED OUT, so no capture event fired and the stale
  pending survived to absorb the next frame. FIX v2 (final): the retirement runs
  at EVERY capture event, selected or sampling-skipped — in a strictly in-order
  single-owner pipeline, frame(X) always precedes the NEXT message's arrival at
  the capture boundary, so ANY pending incomplete at ANY capture is provably
  stale (retired as UNPAIRED_CAPTURE, never paired). REGRESSIONS:
  MCK5ObserverGates.droppedFramePairingHardening (selected-next) and ...v2
  (sampled-out-next) — deterministic mid-pipeline frame swallows; gates 23/23.
  VERIFIED live at the exact campaign sampling (every=2 boot): 200/200 matched,
  0 mismatched, unpairedCapture=1 per connection (the FML|MP header, honestly
  counted), client 10,948 frames decoded with 0 errors.
