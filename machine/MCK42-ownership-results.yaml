  bound handler succeeds — permissive loop — so embedded membership alone is not
  evidence); g3 ordered write/update/write: f1 compressed, f2 passthrough (dataLen=0
  proves the 64-update applied first), f3 disabled (no dataLen), exact token sequence
  256,64,-1; g4 off-owner sync REJECTED + queued update ACKed and applied ON the
  owner thread (lastUpdateThread == executor thread); g4-neg token-swap control;
  g5a close with an encode QUEUED behind a blocked executor: FIFO guarantees write
  then free, free EXACTLY ONCE, ctx dead; g5b BOTH removal modes (explicit
  pipeline.remove AND channel close) free exactly once after completed work; g5c
  post-removal native use returns null; g6 two channels on one group: different
  thresholds, different live native ctx, independent frees; g7 simulated creation
  failure (package-private property-immune seam; the real frameCreate==0 path is
  handled by the same code): deterministic EncoderException('creation failed at
  attach'), no NPE, removal still frees exactly once.
