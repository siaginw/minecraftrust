implementation: >
  Ownership bound to the CHANNEL EXECUTOR captured in handlerAdded (ctx.executor()) —
  no caller-captured owner exists, so a pre-attachment or unexpected first caller can
  never claim ownership. Pre-attachment setThreshold = plain configuration on any
  thread (binds nothing). Post-attachment synchronous setThreshold requires the REAL
  membership check ownerExecutor.inEventLoop() — off-owner calls REJECTED
  (IllegalStateException); the explicit queued form updateThresholdAsync(int) returns
  a CompletableFuture acknowledged after the update runs on the owning executor.
  ORDERING CLAIM limited to the executor contract: one handler -> one single-thread
  executor -> FIFO task queue, so encodes, queued updates, and the marshaled free run
  in submission order; NOTHING is implied between unrelated racing submissions.
  encode defensively re-checks membership (one inEventLoop() call per encode —
  measured as part of arm C in the benchmark).
netty_4_1_9_close_finding: >
  PROBE-VERIFIED: in Netty 4.1.9 a channel CLOSE alone NEVER invokes handlerRemoved
  for a handler bound to a FOREIGN executor (close + runPendingTasks + executor
  drain left the native context live: frees=0, ctx live). Explicit pipeline.remove
  DOES marshal handlerRemoved onto the owning executor. FIX: dual cleanup —
  close(ChannelHandlerContext,ChannelPromise) (outbound close propagates tail->head
  through the pipeline, so the hook fires for foreign-bound handlers) AND
  handlerRemoved (explicit removal/replacement, the NetworkManager path), both
  funneling into one CAS-guarded exactly-once free; off-owner free is enqueued on
  the owning executor BEHIND already-submitted encodes (never frees a context with
  queued work), with inline fallback if the executor rejects. MessageToByteEncoder
  is outbound-only (no channelInactive available) — close() is the correct
  outbound-side lifecycle hook.
gates_15_15: >
  g1 configure on thread A + attach/encode on real executor B (encode thread proven
  == executor thread, != caller); g2 wrong-thread sync setThreshold REJECTED with a
