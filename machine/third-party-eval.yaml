simdnbt_evaluation:
  verdict: PARITY_PASS
  detail: >
    22/22 parity checks PASS across our fixture set (vanilla tag space,
    ForgeCaps-shaped compounds with NUL-in-keys + emoji MUTF-8, TileEntity
    custom tags, LongArray-heavy, 5x8 and 12x2 deep/large compounds,
    1.12.2 chunk shape, tag-space edge (i32/i64 extremes, empty
    compound-list), MUTF-8 edges (NUL, surrogate pair, DEL, U+10FFFF)).
    Parity protocol: simdnbt decodes OUR encoder's bytes; simdnbt re-encode
    of its decode must round-trip byte-semantically through OUR decoder.
    1 recorded behavioral divergence: root-type-0 document - OUR codec
    ACCEPTS (vanilla 1.12.2 CompressedStreamTools accepts type-0 root as
    empty NBT) while simdnbt REJECTS; ours is the vanilla-compatible
    behavior. Depth: our codec enforces MAX_DEPTH=512 on encode; simdnbt
    accepts 400-deep (both pass); no reader depth limit in vanilla.
    Malformed: both REJECT empty/truncated/bad-type-id inputs.
  performance_medians: >
    decode: simdnbt 1.7-2.8x faster than crates/nbt (large_5x8 5.33ms vs
    1.93ms); encode: simdnbt 3.7-16.3x faster (large_5x8 2.34ms vs
    0.14ms); scan(full decode): 1.7-3.7x faster. Same fixtures, medians
    of 200 after 50 warmup, release+nightly (portable_simd).
fastanvil_evaluation:
  verdict: DIRECTLY_REUSABLE_READ_PATH (write path ADAPTABLE)
  detail: >
    8/8 checks on our REAL region files (targetA r.0.0.mca 625 chunks,
    targetB r.0.0.mca 151 chunks): location-table agreement (625/625,
    151/151), every chunk decompresses and parses as valid NBT (fastnbt),
    4096-sector alignment holds, overwrite-same-chunk readback byte-equal,
    new-chunk-in-absent-slot readback byte-equal (sector relocation),
    truncated-file iteration completes without panic (errors surfaced as
    per-entry errors: 307/72). Handles zlib(2) scheme on read; write path
    tested with Zlib scheme explicitly. Java-side byte comparison uses the
    file bytes themselves (generated by the vanilla Java RegionFile in
    real play - the strongest available reference).
license_constraints:
  - "MIT (simdnbt, fastnbt): compatible with evaluation and potential future adaptation with attribution"
  - "GPL-3 (Velocity native): PATTERN REFERENCE ONLY - no code copying into our tree"
  - "LGPL-3 (Starlight, Lithium, Cleanroom): REFERENCE ONLY"
