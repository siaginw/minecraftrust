    observed: "ServerThread: nbt-binary-read 3, decompress 1 (streaming); async thread parse unquantified; dominated instead by state->id (324) + palette/rebuild (61)"
    thread: ServerThread + Chunk I/O Executor
    removable: "small: binary parse only"
    risks: "HIGH (disk-format on write; NEID hooks + persisted-corruption on read)"
    missing_evidence: "async-thread parse/copy split; save-path on a dirty-world workload"
    verdict: DEPRIORITIZED
  - id: H2-blockstate-read-and-id-map
    observed: "getBlockState cluster 11.1% presence (engine read path); state->id map ~3.5% self streaming + dominant on save/load"
    thread: ServerThread (all phases)
    removable: "possible Java-side map/cache optimization; NOT an FFI migration"
    risks: "engine patch behavior changes observable to mods; id-map is a Forge registry invariant"
    missing_evidence: "caller census above World.getBlockState; a dirty-world save capture"
    verdict: JAVA_SIDE_CANDIDATE_NOT_NATIVE
  - id: H3-tinkers-recipe-hotloop
    observed: "12.6% stack presence streaming; mod-owned"
    verdict: OUT_OF_SCOPE_FOR_NATIVE (unchanged)
