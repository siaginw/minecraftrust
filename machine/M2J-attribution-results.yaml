h1_reassessment_native_nbt_decoder:
  would_replace: "binary NBT parsing + inflation: measured at 3+1 samples on ServerThread (streaming) plus an unquantified fraction of the async Chunk I/O thread's parse; SMALL."
  would_not_replace: >
    ~92% of the observed load-path cost is Java object/state
    reconstruction that must remain Java: state<->id registry translation
    (BlockCallbacks/IntIdentityHashBiMap, engine+Forge invariant),
    palette/section materialization into Java IBlockState graphs, NEID's
    injected section hooks, TE/entity read, Forge ChunkIO callbacks.
    A native decoder that emits a Java NBT tree ADDS a conversion copy
    and leaves all of that in place; a decoder that populates sections
    directly bypasses NEID/mod hooks (compatibility risk, not just
    speed). Read-side risk confirmed: incorrectly loaded state can later
    be saved (persisting corruption).
  verdict: "the recording does NOT isolate a meaningful removable cost for a native NBT decoder on this workload. H1 deprioritized."
h2_reassessment_blockstate_cluster:
  observed: >
    World.getBlockState -> Chunk.getBlockState read cluster = 11.1%
    stack presence streaming (253/296 via World.func_180495_p), engine
    code, no mod transformation involved; state->id map is the largest
    single transversal cost across ALL phases (stream 126 + recovery 198
    + async thread 151 self).
  removable: >
    Not by native migration (reads are engine behavior; must stay
    observable to mods). The state->id map cost is a plausible JAVA-side
    candidate (cache/tune ClearableObjectIntIdentityMap lookups on the
    save/load paths) - an engine-patch-scale change, not an FFI migration.
