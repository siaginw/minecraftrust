classification: OPTIMIZATION_NOT_EXHAUSTED
classification_reasoning: >
  The complete kernel is now bit-exact end-to-end (noise + assembly) and
  RUST_OPTIMIZED beats HotSpot at the engine's BATCH shape (n>=4, 2-6%) —
  but the realistic single-chunk invocation shape (n=1, which Forge's
  one-chunk-per-call pipeline actually produces) still loses 1.50x despite
  the new x-lane kernel. Named, plausible, exact-safe techniques remain
  untested at n=1: persistent per-octave slabs, deeper per-column gather
  hoisting (the y-skip already amortizes; x-column chains could too),
  fused 3-field-per-crossing, and an AVX-512 8-wide variant on this
  AVX-512-capable CPU. Per the decision rule this is
  OPTIMIZATION_NOT_EXHAUSTED — not RUST_VALID_ARCHITECTURAL (n=1 loses),
  not NOT_WORTH_IT (research + optimization are demonstrably not exhausted;
  the sign already flipped once this milestone).
recommendation: >
  One more bounded offline optimization pass on the n=1 path (persistent
  slabs + fused fields + AVX-512) before any live-SHADOW decision. If n=1
  still loses after that, classify BATCH_DEPENDENT and hand the
  architectural evaluation (queue-based multi-chunk pipeline) to the
  operator — the noise fields are position-pure so a look-ahead batch
  pipeline is semantically safe; whether its latency is acceptable is an
  engine-design question, not an evidence question.
stop: "Offline prototype only. No server runs, no live integration, no SHADOW, no default changes."
