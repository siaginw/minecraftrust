      writes: ["ChunkProviderServer.loadedChunks"]
      forge_hooks: []
      mod_observable: false
      parallelism_constraints: "Polls async chunk tasks loaded from disk; binds chunk pointers into world on Server thread"
      evidence: "MinecraftServer.java.patch:168"
      profiling_key: "levels"

    - id: "SCHEDULED_TASKS_DRAIN"
      method: "synchronized (this.futureTaskQueue) { Util.runTask(...) }"
      thread: "Server thread"
      owner: "MinecraftServer"
      order: 4
      reads: ["this.futureTaskQueue"]
      writes: ["this.futureTaskQueue", "arbitrary world state via tasks"]
      forge_hooks: []
      mod_observable: true
      parallelism_constraints: "Drains MPSC queue; task handlers mutate world state; must finish before world simulation begins"
      evidence: "MinecraftServer.java:549-554; Util.java:11-22"
