# Minecraft 1.12.2 / Forge 14.23.5.2860 Authoritative Tick Sequence
schema_version: "1.0.0"
runtime_target:
  game_version: "1.12.2"
  forge_version: "14.23.5.2860"
  forge_commit: "d3f01843f7e7a4f613b5e8113d381fd8747b4343"

loop_timing:
  target_tick_ms: 50
  target_tps: 20.0
  time_source: "System.currentTimeMillis()"
  max_lag_clamp_ms: 2000
  max_burst_ticks: 40
  min_yield_sleep_ms: 1
  sleeping_fast_path:
    condition: "this.worlds[0].areAllPlayersAsleep()"
    action: "tick(); accumulator = 0L;"

server_tick:
  id: "SERVER_TICK_ROOT"
  method: "net.minecraft.server.MinecraftServer.tick()"
  thread: "Server thread"
  owner: "MinecraftServer"
  order: 1
  evidence: "MinecraftServer.java:499-570; MinecraftServer.java.patch:160-230"
  phases:
    - id: "SERVER_TICK_START_EVENT"
      method: "net.minecraftforge.fml.common.FMLCommonHandler.onPreServerTick()"
      thread: "Server thread"
      owner: "FMLCommonHandler"
      order: 1
      reads: ["MinecraftServer.tickCounter"]
      writes: []
      forge_hooks: ["net.minecraftforge.fml.common.gameevent.TickEvent$ServerTickEvent(Phase.START)"]
      mod_observable: true
      parallelism_constraints: "Must execute on Server thread; synchronous mod event subscribers"
      evidence: "MinecraftServer.java.patch:163"
      profiling_key: null

    - id: "TICK_COUNTER_INCREMENT"
      method: "this.tickCounter++"
      thread: "Server thread"
      owner: "MinecraftServer"
      order: 2
      reads: ["this.tickCounter"]
      writes: ["this.tickCounter"]
      forge_hooks: []
