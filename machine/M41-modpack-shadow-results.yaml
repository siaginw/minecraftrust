    diagnosis: >
      Density-field kernel remains bit-exact under SevTech (46.9M doubles, 0 mismatches),
      but the base-terrain PRIMER fill diverges from the vanilla-fill model at every chunk
      from the first cell (y=0 air vs stone). SevTech ships sevpatches-1.9-10.jar and
      JustEnoughIDs-1.0.3-55.jar Mixin tweakers that patch chunk/primer code. The terrain
      kernel's vanilla-fill assumption (stone at density>0, hardcoded stone=16/water=144,
      sea level from settings) does not hold for this pack's patched fill.
    diagnosis_correction_m42a: >
      SUPERSEDED 2026-09-21 (M4.2A evidence, keep original diagnosis above for history):
      decompiling the installed JustEnoughIDs-1.0.3-55 MixinChunkPrimer shows the primer's
      block getBlockState/setBlockState are redirected at HEAD to a private int[65536]
      intData holding runtime registry state ids, and the original methods are CANCELLED —
      char[] field_177860_a is never read or written under JEID and stays all-air. The M4.1
      comparator read that dead array as its oracle, so j=0(air)/r=16(stone) at every cell
      was a COMPARATOR ARTIFACT, not a fill divergence. sevpatches only patches spawn-chunk
      logic (irrelevant). The terrain kernel itself was never contradicted by this data.
      See machine/M42A-representation-results.yaml for the logical-oracle probe.
    safety_behavior: >
      The M4 retention gate worked exactly as designed: registration requires terrain
      bit-identity, so 0 NativeChunks were retained, 0 packet/persistence bytes produced,
      comparison stayed read-only. No leak, no crash, server ran to clean stop.
    verdict: DIVERGENT_PACK_TERRAIN_FILL — M4 retention correctly self-disabled; field-level kernel remains valid
