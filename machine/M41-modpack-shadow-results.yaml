    refresh_section_12kb: {mean_us: 2.67, p50_us: 2.70, effective_bandwidth_gbps: 4.60}
    refresh_section_8kb: {mean_us: 2.21, p50_us: 2.20}
    five_section_chunk_refresh: {mean_us: 11.14, p50_us: 11.10}
    register_primer_full_chunk_128kb: {mean_us: 44.58, p50_us: 39.90}
    encode_packet_cached_palette: {mean_us: 1.22, p50_us: 1.30}
    refresh_plus_encode_60state: {mean_us: 80.58, note: "dominated by palette rebuild ~70us (linear dedup scan), not the 2.7us transfer"}
    refresh_plus_encode_4state: {mean_us: 13.65, p50_us: 13.20}
