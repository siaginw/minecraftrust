claim_scope_qualifications:
  - "29.9% is the reduction of the POOLED MEDIAN packet-path time of the eligible fixture class in this offline corpus. It is NOT a whole-server speedup and implies nothing about MSPT/TPS."
  - "It is NOT >=25% on every eligible fixture: per-fixture p50 delta ranges 3.8% (det7) to 37.1% (sweep4_1); 7 of 21 eligible fixtures are below 25%."
  - "Tail behavior is mixed: pooled p99 is ~5% WORSE for native; 8 of 21 eligible fixtures regress at p99 (worst det5 -66.3%). Latency-sensitive evaluation must weigh p99, not only p50."
  - "The 8192-byte eligibility threshold is validated ONLY on this 24-fixture corpus (TP=21/FP=0/TN=3/FN=0). Generalization to arbitrary packs/worlds is untested."
  - "Same-machine, same-run, equal-scope comparison (see docs/engineering/m1-benchmark-scopes.md). Cross-scope comparisons (e.g. vs vanilla ctor ~72us) are invalid."
gate_status:
  GATE-PERF-MICRO: "PASS at p50 on eligible fixtures (native p50 2.50-7.10us, all < 8.5us, all beat Java same-run). p99 mixed — see qualifications. Gate text unchanged."
  GATE-PERF-SERVER: "OPEN — no whole-server MSPT/TPS measurement performed"
  GATE-PERF-ALLOC: "OPEN — allocation-churn reduction not measured"
  GATE-PERF-REGRESS: "OPEN — no cross-target TPS/cadence/GC-pause regression campaign performed"
