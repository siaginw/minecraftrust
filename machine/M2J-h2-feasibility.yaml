interpretation:
  the_map_is_not_the_problem: >
    Vanilla/Forge use of the registry map is palette-sized (a few dozen
    lookups per section). The observed volume comes from NEID's
    blockStateContainer_getDataForNBT hook, which the caller census shows
    sits between AnvilChunkLoader.write and the registry map on EVERY
    phase's dominant chain - i.e. NEID's extended-id serialization
    performs per-cell-scale registry translation during chunk saves. The
    same hook family (setDataFromNBT) drives the load-side palette-local
    map heat on the async Chunk I/O thread. Optimizing the map would be
    optimizing the wrong layer: the driver is a mod's usage pattern.
  candidate_changes_considered:
    - "replace/augment BlockCallbacks$1 IdentityHashMap (Forge core patch or coremod): coherent invalidation exists, BUT the beneficiary is NEID's hot loop; magnitude on this workload is 6-19% presence in specific windows; risk touches a Forge registry invariant used by every mod"
    - "per-state cached id field on StateImplementation (vanilla coremod patch): same beneficiary problem + vanilla class patch"
    - "fix NEID's serialization loop (fork/patch the mod): correct layer, but mod-owned code - out of project scope by the operator's compatibility rules"
  verdict: PARK_H2
  reason: >
    Existing evidence does not justify a bounded prototype: the removable
    cost is driven by a mod's (NEID) serialization pattern, not by an
    inefficient engine/Forge structure; the only in-scope changes would
    optimize the wrong layer for a workload-window-bounded benefit, and
    the honest size estimate carries sampling uncertainty (tens-to-low-
    hundreds of samples). No optimization is manufactured to keep moving.

