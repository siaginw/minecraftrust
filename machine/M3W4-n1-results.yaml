directive_18_classification: RUST_VALID_ARCHITECTURAL
classification_reasoning: >
  At the REAL production shape (n=1, one chunk per call — Forge's actual
  granularity, M3W3 evidence), the final redesigned Rust implementation is
  BIT-EXACT and 5.6% FASTER than the HotSpot Java reference at median
  (275.9 vs 292.3 us per complete chunk density field), with the entire
  terrain-density computation owned by a single coarse native call and
  zero hot-path allocation. This is not a material win (not RUST_STRONG)
