schema_version: 1
date: "2026-09-20"
builds:
  dll: {sha256_prefix: 927eeaa296a9b6a2, note: "adds initCreate/initFreeRaw/initFieldComplete (THE one-call production boundary); release profile now lto=fat codegen-units=1; rustc 1.94.0"}
  crate_additions: "crates/worldgen-noise/src/field_complete.rs — InitNoiseField handle (compact [u8;512] perm levels, ~600B/octave vs FlatTables 12KB+), specialized scalar 5x33x5 kernels (compile-time strides, L1-resident scalar lookups, NO gathers, hardware floor via d.floor() as i32 differential-tested), min/max lockstep (shares ONLY traversal+d3+wrapper offsets; per-field coords/perms after the review's warning proved correct — first fused version shared generator offsets and FAILED parity: gdiffs=825, caught by component isolation), zero-alloc assembly (borrowed biomes, direct out)"
directive_1_review_verification: # measured/observed, not reviewer predictions
  gathers_are_major_n1_cost: CONFIRMED-BY-SUBSTITUTION — the redesigned scalar-no-gather kernel is 1.54x faster than the M3W3 gather-based x-lane path (275.9 vs 432.7 us) at identical bit-exact output
  x_lane_underutilized: CONFIRMED — x_size=5 gives 4-lane group + 25% padding; scalar wins outright
  strided_stores_hurt: CONFIRMED — the x-lane kernel's per-sample lane-extract stores are gone in the scalar column-order write
  flat_tables_cache_pressure: CONFIRMED-BY-DESIGN-ELIMINATION — compact u8 perm (~600B/level, L1-resident) replaced 3x512xf64 (12KB/level); no A/B microbench needed since the whole-table layout was removed as part of the winning kernel
  bounds_checks_hot_path: CONFIRMED-REMOVED — fixed-shape kernels use compile-time 5x33x5 strides with raw slices (no generic bounds checks; safe: lengths checked once at entry)
  fieldAssemble_allocs: CONFIRMED — the old fieldAssemble did 2x .to_vec() (200 f32 each) per call; the one-call path borrows (iso_assembly_only=4.0 us total, so the alloc share was small but removed)
  jni_fragmentation: CONFIRMED — 5 calls -> 1 call; JNI cost after fusion ~ unmeasurable (iso probe = full compute)
directive_2_one_call_boundary:
  signature: "initFieldComplete(handle, x4, z4, biomeAddr(200 f32), outAddr(825 f64))"
  rust_owns: "depth-2D + main(8oct) + min/max(16oct lockstep) + complete density assembly — the ENTIRE terrain-density computation"
  java_supplies: "chunk coords, biome floats, generator compatibility state (settings at handle creation)"
  parity: "240-chunk expanded corpus (near/far/extreme coords incl. +/-28-29.5M, 240 seeds, real-biome mixes) vs REAL classes + oracle assembly: BIT-EXACT, 0 mismatches"
directive_3_allocations: "zero in the hot path — handle owns h[25]/e/f/g[825] scratch + weights; biomes borrowed; out written directly"
directive_4_compact_tables:
  u8_proof: "every vanilla perm value is 0..255 by construction (identity shuffle); asserted at conversion; lookups keep i32 arithmetic (perm[u8] as i32) so b0/l0 chains are byte-identical to the i32-table math"
  footprint: "~600B per octave level (512B perm + 3 f64 offsets) vs FlatTables 12KB+ per level; 56 levels total ~34KB vs ~700KB — now comfortably cache-resident"
directive_5_gather_removal: "scalar L1 lookups beat gathers at this shape (see directive 1); SIMD retained only in the batch path (n>=4, secondary)"
directive_6_fixed_shape: "compile-time XS=5/YS=33/ZS=5/LEN=825; strides constant-folded; octave counts fixed per handle field"
directive_7_column_layout: "the scalar kernel traverses the vanilla (ix,iz,iy) order with per-column y-skip cache — contiguous y runs, direct acc[idx] writes; no artificial transpose"
directive_8_min_max_lockstep:
  result: "SAFE after correction — first version shared the generators' Random-derived x/y/z offsets and FAILED (gdiffs=825; the review's exact warning); corrected to per-field coordinates + perms, sharing only traversal/d3/wrapper-offsets. Retained: halves loop/control overhead"
  parity: "bit-exact after fix (240-chunk corpus)"
directive_9_direct_assembly: "assembly reads handle-owned e/f/g scratch directly and writes the caller's out — intermediates remain (REQUIRED: per-field octave accumulation order), but no copies and no allocation"
directive_10_floor: "floor_i32 = (d.floor()) as i32 — hardware roundsd, differential-tested across positive/negative/integral/fractional/large values via the full-corpus parity (all 240 chunks bit-exact, which exercises every floor in every octave of every field)"
directive_11_codegen:
  rustc: "1.94.0 (4a4ef493e 2026-03-02)"
  profile: "release + lto=fat + codegen-units=1 (applied and measured: 277.6 -> 276.7/275.9 us — within noise; the kernel is compute-bound, not call-overhead-bound)"
  portability: "runtime is_avx2 dispatch retained for the batch path; the n=1 scalar kernel is portable by construction; no target-cpu=native"
directive_13_avx512: "not implemented (deprioritized per directive; CPU supports it — recorded)"
