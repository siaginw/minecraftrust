[package]
name = "compression"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
buffers = { workspace = true }
# Pinned backend: zlib-rs (pure-Rust zlib), NOT the default miniz_oxide and
# NOT a C zlib-ng wrapper. Effective backend asserted at runtime in tests
# (flate2::backend()) and recorded in every harness output.
flate2 = { version = "=1.1.10", features = ["zlib-rs"], default-features = false }

